<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrant — Starship Combat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <h1>QUADRANT</h1>
            <div id="room-code" title="Room code — share with friends to join (multiplayer coming soon)"></div>
            <div id="phase-indicator">Setup</div>
            <div id="round-indicator">Round 0</div>
            <button id="btn-new-game" class="btn btn-ghost">New Game</button>
        </header>

        <main id="game-area">
            <canvas id="hex-canvas"></canvas>
            <div id="sidebar">
                <h2>Roster</h2>
                <div id="ship-roster"></div>
                <h2>Action</h2>
                <div id="action-panel"></div>
                <h2>Battle Log</h2>
                <div id="log"></div>
            </div>
        </main>
    </div>

    <div id="ship-details" class="hidden"></div>
    <div id="ship-tooltip" class="hidden"></div>

    <script src="js/hex.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
