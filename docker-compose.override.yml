services:
  server:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-development}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      # Live UI: edits to wwwroot are picked up on browser refresh, no rebuild.
      - ./src/Quadrant.Server/wwwroot:/app/wwwroot:ro
